name: Build Nakon-PDF APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Nakon-PDF APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle and Keystore
        run: |
          # 1. Restore or generate debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Ensure gradlew exists and has execute permission
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

          # 3. Create .env file for build
          touch .env
          echo "APP_NAME=Nakon-PDF" >> .env

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Nakon-PDF APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nakon-pdf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
